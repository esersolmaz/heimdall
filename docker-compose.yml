services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: bash -lc "pip install -e . && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db

  worker:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: bash -lc "pip install -e . && celery -A apps.worker.celery_app.celery_app worker --loglevel=info"
    depends_on:
      - redis

  redis:
    image: redis:7

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: heimdall
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
